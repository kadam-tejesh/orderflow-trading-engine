
server.port=8083
spring.application.name=kafka-risk-service

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all

spring.kafka.consumer.group-id=risk-management-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.orderflow.kafka_risk_service.event

orderflow.kafka.topic.trade-executions=trade.executions
orderflow.kafka.topic.order-book-updates=order.book.updates

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:riskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console (browse data at http://localhost:8083/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
